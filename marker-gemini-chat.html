<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marker: AI chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['"Bricolage Grotesque"','ui-sans-serif','system-ui','sans-serif'],mono:['"JetBrains Mono"','ui-monospace','monospace']},
colors:{ink:'#172033',board:'#F6F7F9',blue:{DEFAULT:'#2B59FF',soft:'#E8EDFF'},mark:'#FFE066',coral:'#FF6B5A',mint:'#19A974'}}}};
</script>
<style>
:root{--line:#DDE1E9}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#172033;background:#F6F7F9 radial-gradient(#D3D8E2 1px,transparent 1.2px) 0 0/22px 22px;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button{cursor:pointer}
:focus-visible{outline:2.5px solid #2B59FF;outline-offset:2px;border-radius:8px}
::selection{background:#FFE066}
.scroll{scrollbar-width:thin;scrollbar-color:#C9CFDB transparent}
/* markdown */
.md{font-size:15.5px;line-height:1.7;max-width:72ch;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.65em 0}
.md h1,.md h2,.md h3,.md h4{font-weight:700;line-height:1.25;margin:1.3em 0 .45em;letter-spacing:-.01em}
.md h1{font-size:1.45em}.md h2{font-size:1.25em}.md h3{font-size:1.1em}.md h4{font-size:1em}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}.md ul{list-style:disc}.md ol{list-style:decimal}
.md li{margin:.2em 0}.md li::marker{color:#2B59FF}
.md a{color:#2B59FF;text-decoration:underline;text-underline-offset:3px}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:4px solid #FFE066;background:#FFFBE6;border-radius:0 10px 10px 0}
.md hr{border:0;border-top:2px dashed var(--line);margin:1.4em 0}
.md code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:#EAEEF6;padding:.15em .4em;border-radius:6px}
.md .tw{overflow-x:auto;margin:.9em 0;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.md table{border-collapse:collapse;width:100%;font-size:.92em}
.md th,.md td{padding:.5em .8em;border-bottom:1px solid var(--line);text-align:left}
.md th{background:#F1F3F8;font-weight:600}.md tr:last-child td{border-bottom:0}
.cb{background:#131A2B;border-radius:14px;overflow:hidden;margin:.9em 0;box-shadow:4px 4px 0 #D3D8E2}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:.4rem .6rem .4rem .95rem;background:#1B2440;color:#9FB0D6;font:500 12px 'JetBrains Mono',monospace}
.cb-copy{display:flex;gap:6px;align-items:center;color:#C5D0EE;padding:4px 9px;border-radius:8px;font:500 12px 'JetBrains Mono',monospace;transition:background .15s,color .15s}
.cb-copy:hover{background:#2A3560}.cb-copy.ok{color:#7FE7B0}
.cb pre{margin:0;padding:1rem;overflow-x:auto;font:400 13px/1.65 'JetBrains Mono',monospace;color:#E6EBF8;tab-size:2}
.cb code{background:none;padding:0;font:inherit;color:inherit}
.tk-c{color:#6F7FA6;font-style:italic}.tk-s{color:#8EE3A4}.tk-n{color:#FFB86B}.tk-k{color:#9DB4FF}.tk-f{color:#FFE066}
/* motion */
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
.msg{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
.dot{width:7px;height:7px;border-radius:99px;background:#2B59FF;animation:bounce 1.1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.caret::after{content:'';display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:-3px;background:#2B59FF;border-radius:2px;animation:bounce 1s infinite}
.note{transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.note:hover{transform:rotate(0) translateY(-4px) scale(1.03)!important;box-shadow:0 10px 18px -8px rgba(23,32,51,.35)}
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh}
dialog::backdrop{background:rgba(23,32,51,.35);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .22s ease}
.s-item .del{opacity:0}.s-item:hover .del,.s-item:focus-within .del{opacity:1}
@media(hover:none){.s-item .del{opacity:.7}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="font-sans">
<div class="flex h-full overflow-hidden">
  <div id="scrim" class="fixed inset-0 z-30 bg-ink/30 backdrop-blur-[2px] opacity-0 pointer-events-none transition-opacity md:hidden"></div>

  <aside id="side" class="fixed inset-y-0 left-0 z-40 flex w-[288px] -translate-x-full flex-col border-r-2 border-ink/10 bg-white/90 backdrop-blur transition-transform duration-300 md:static md:translate-x-0" style="padding-top:env(safe-area-inset-top)">
    <div class="flex items-center gap-2.5 px-4 pb-3 pt-4">
      <div class="grid h-9 w-9 place-items-center rounded-xl bg-ink text-white" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFE066" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/></svg></div>
      <div class="leading-tight"><div class="text-[17px] font-bold tracking-tight">Marker</div><div class="text-xs text-ink/55">Any model, your key</div></div>
    </div>
    <div class="px-3 pb-2"><button id="new" class="flex w-full items-center justify-center gap-2 rounded-xl bg-blue px-3 py-2.5 text-sm font-semibold text-white shadow-[0_3px_0_#1B3FBF] transition active:translate-y-[2px] active:shadow-none hover:brightness-110">New chat</button></div>
    <nav id="list" class="scroll flex-1 space-y-1 overflow-y-auto px-2 py-2" aria-label="Chat history"></nav>
    <div class="border-t-2 border-ink/10 p-3"><button id="open-set" class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-left text-sm font-medium hover:bg-blue-soft">
      <span id="keydot" class="h-2.5 w-2.5 rounded-full bg-coral"></span><span class="flex-1">Settings</span><span id="keystate" class="text-xs text-ink/50">No key</span></button></div>
  </aside>

  <main class="relative flex min-w-0 flex-1 flex-col">
    <header class="flex items-center gap-2 border-b-2 border-ink/10 bg-white/80 px-3 py-2.5 backdrop-blur md:px-5">
      <button id="menu" class="grid h-10 w-10 place-items-center rounded-xl hover:bg-blue-soft md:hidden" aria-label="Open chat list"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <h1 id="title" class="min-w-0 flex-1 truncate text-[15px] font-semibold">New chat</h1>
      <div id="totals" class="hidden items-center gap-1.5 rounded-full border-2 border-ink/10 bg-white px-3 py-1 font-mono text-[11.5px] sm:flex" title="Tokens used in this chat"></div>
      <button id="model-pill" class="max-w-[9.5rem] truncate rounded-full bg-mark px-3 py-1.5 font-mono text-[11.5px] font-medium text-ink transition hover:brightness-95 sm:max-w-[14rem]" title="Change model"></button>
    </header>

    <div id="scroller" class="scroll flex-1 overflow-y-auto scroll-smooth">
      <div id="msgs" class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-4 py-6 md:px-6"></div>
    </div>

    <div class="px-3 pb-3 pt-1 md:px-6 md:pb-5">
      <div class="mx-auto max-w-3xl">
        <div class="flex items-end gap-2 rounded-[22px] border-2 border-ink/15 bg-white p-2 shadow-[0_6px_0_#DDE1E9] transition focus-within:border-blue">
          <textarea id="input" rows="1" placeholder="Message" class="scroll max-h-[200px] min-h-[44px] flex-1 resize-none bg-transparent px-3 py-2.5 text-base leading-6 outline-none placeholder:text-ink/40" aria-label="Message"></textarea>
          <button id="send" class="grid h-11 w-11 shrink-0 place-items-center rounded-2xl bg-ink text-white transition hover:bg-blue disabled:opacity-30 disabled:hover:bg-ink" aria-label="Send message"></button>
        </div>
        <p class="mt-2 text-center text-xs text-ink/50">Enter sends. Shift+Enter adds a line. AI can make mistakes, so check anything important.</p>
      </div>
    </div>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" id="set-form" class="m-auto w-[min(92vw,520px)] rounded-3xl border-2 border-ink bg-white p-5 shadow-[8px_8px_0_#172033] sm:p-6">
    <div class="mb-1 flex items-center justify-between"><h2 class="text-xl font-bold tracking-tight">Settings</h2><button type="button" id="dlg-x" class="grid h-9 w-9 place-items-center rounded-xl hover:bg-board" aria-label="Close settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p id="dlg-note" class="mb-4 hidden rounded-xl bg-mark/60 px-3 py-2 text-sm font-medium"></p>
    <label class="mb-1 mt-3 block text-sm font-semibold" for="f-prov">Provider</label>
    <select id="f-prov" class="w-full rounded-xl border-2 border-ink/15 bg-white px-3 py-2.5 text-sm font-medium outline-none focus:border-blue"></select>
    <div id="url-wrap" class="hidden"><label class="mb-1 mt-4 block text-sm font-semibold" for="f-url">Base URL</label>
    <input id="f-url" spellcheck="false" class="w-full rounded-xl border-2 border-ink/15 px-3 py-2.5 font-mono text-sm outline-none focus:border-blue">
    <p class="mt-1.5 text-xs text-ink/55">Any OpenAI-compatible server, such as Ollama, LM Studio or vLLM. It must allow browser (CORS) requests.</p></div>
    <label class="mb-1 mt-4 block text-sm font-semibold" for="f-key">API key</label>
    <div class="flex gap-2"><input id="f-key" type="password" autocomplete="off" spellcheck="false" class="min-w-0 flex-1 rounded-xl border-2 border-ink/15 px-3 py-2.5 font-mono text-sm outline-none focus:border-blue">
      <button type="button" id="f-eye" class="rounded-xl border-2 border-ink/15 px-3 text-sm font-medium hover:bg-board">Show</button></div>
    <p id="key-help" class="mt-1.5 text-xs text-ink/55"></p>
    <label class="mb-1 mt-4 block text-sm font-semibold" for="f-model">Model</label>
    <input id="f-model" list="models" spellcheck="false" class="w-full rounded-xl border-2 border-ink/15 px-3 py-2.5 font-mono text-sm outline-none focus:border-blue"><datalist id="models"></datalist>
    <div id="chips" class="mt-2 flex flex-wrap gap-1.5"></div>
    <div class="mt-4 flex items-center justify-between"><label class="text-sm font-semibold" for="f-temp">Creativity</label><span id="f-temp-v" class="font-mono text-xs text-ink/60"></span></div>
    <input id="f-temp" type="range" min="0" max="2" step="0.1" class="w-full accent-blue">
    <label class="mb-1 mt-3 block text-sm font-semibold" for="f-sys">System instructions <span class="font-normal text-ink/50">(optional)</span></label>
    <textarea id="f-sys" rows="3" placeholder="e.g. Answer briefly and use plain language." class="w-full resize-none rounded-xl border-2 border-ink/15 px-3 py-2.5 text-sm outline-none focus:border-blue"></textarea>
    <p id="test-out" class="mt-3 min-h-[1.25rem] text-sm"></p>
    <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
      <button type="button" id="f-clear" class="rounded-xl px-3 py-2 text-sm font-medium text-coral hover:bg-coral/10">Remove key</button>
      <div class="flex gap-2"><button type="button" id="f-test" class="rounded-xl border-2 border-ink/15 px-4 py-2.5 text-sm font-semibold hover:bg-board">Test key</button>
      <button type="submit" class="rounded-xl bg-blue px-5 py-2.5 text-sm font-semibold text-white shadow-[0_3px_0_#1B3FBF] active:translate-y-[2px] active:shadow-none">Save</button></div>
    </div>
  </form>
</dialog>
<div id="toasts" class="pointer-events-none fixed bottom-24 left-1/2 z-50 flex -translate-x-1/2 flex-col items-center gap-2"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1e4?(n/1e3).toFixed(1)+'k':String(n||0);
const I={
 send:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 stop:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>',
 copy:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>',
 check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
 redo:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 6M20 4v7h-7"/></svg>',
 trash:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 spark:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFE066" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>'
};

/* ---------- storage ---------- */
const Store={
 read(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},
 write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{UI.toast('Browser storage is full or blocked, so chats won’t be saved.','err');return false}}
};

/* ---------- markdown + highlighting ---------- */
const HL={
 KW:new Set('break case catch class const continue def default del do else elif enum export extends finally for from func function if import in interface is lambda let new not or and pass private public raise return static struct super switch this throw try type var void while with yield async await fn impl use mod pub match package None True False null true false undefined self SELECT FROM WHERE INSERT INTO UPDATE DELETE JOIN CREATE TABLE ORDER BY GROUP LIMIT AND OR NOT NULL echo fi then done'.split(' ')),
 run(code,lang=''){
  lang=lang.toLowerCase();
  const hash=/^(py|python|sh|bash|zsh|shell|yaml|yml|rb|ruby|toml|r|ini|dockerfile|make|perl)$/.test(lang),sql=lang==='sql',markup=/^(html|xml|svg|vue)$/.test(lang);
  if(/^(text|txt|plain|json|)$/.test(lang)&&lang!=='json')return esc(code);
  const cm=hash?'#[^\\n]*':sql?'--[^\\n]*':markup?'<!--[\\s\\S]*?-->':'\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/';
  const re=new RegExp('('+cm+')|("""[\\s\\S]*?"""|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)|(\\b\\d[\\d_.]*\\b)|('+(markup?'<\\/?[\\w-]+|\\/?>':'[A-Za-z_$][\\w$]*(?=\\s*\\()')+')|([A-Za-z_$][\\w$]*)|([\\s\\S])','g');
  let o='',m;
  while((m=re.exec(code))){
   if(m[1])o+=`<span class="tk-c">${esc(m[1])}</span>`;
   else if(m[2])o+=`<span class="tk-s">${esc(m[2])}</span>`;
   else if(m[3])o+=`<span class="tk-n">${m[3]}</span>`;
   else if(m[4])o+=`<span class="${markup?'tk-k':HL.KW.has(m[4])?'tk-k':'tk-f'}">${esc(m[4])}</span>`;
   else if(m[5])o+=HL.KW.has(m[5])?`<span class="tk-k">${m[5]}</span>`:m[5];
   else o+=esc(m[6]);
  }
  return o;
 }
};
const MD=(()=>{
 const inline=s=>{
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>'\u0000'+(codes.push(c)-1)+'\u0000');
  s=esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>').replace(/~~([^~\n]+)~~/g,'<del>$1</del>')
   .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${esc(codes[i])}</code>`);
 };
 const codeBlock=(code,lang)=>`<div class="cb"><div class="cb-h"><span>${esc(lang||'text')}</span><button class="cb-copy" data-act="code">${I.copy}<span>Copy</span></button></div><pre><code>${HL.run(code,lang)}</code></pre></div>`;
 const LI=/^(\s*)([-*+]|\d+[.)])\s+(.*)/;
 const buildList=(it,p,ind)=>{
  const ord=/\d/.test(it[p[0]].mk);let h=ord?'<ol>':'<ul>';
  while(p[0]<it.length&&it[p[0]].ind>=ind){
   const x=it[p[0]];if(x.ind>ind){h+=buildList(it,p,x.ind);continue}
   p[0]++;h+='<li>'+inline(x.txt);
   if(p[0]<it.length&&it[p[0]].ind>x.ind)h+=buildList(it,p,it[p[0]].ind);
   h+='</li>';
  }
  return h+(ord?'</ol>':'</ul>');
 };
 const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 function render(src){
  const L=src.replace(/\r/g,'').split('\n');let o='',i=0,m;
  const starts=l=>/^(```|#{1,4}\s|>|\s*([-*+]|\d+[.)])\s)/.test(l)||/^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
  while(i<L.length){
   const l=L[i];
   if(!l.trim()){i++;continue}
   if((m=l.match(/^```\s*([\w+#.-]*)/))){const b=[];i++;while(i<L.length&&!/^```\s*$/.test(L[i]))b.push(L[i++]);i++;o+=codeBlock(b.join('\n'),m[1]);continue}
   if((m=l.match(/^(#{1,4})\s+(.*)/))){o+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;i++;continue}
   if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){o+='<hr>';i++;continue}
   if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));o+=`<blockquote>${render(b.join('\n'))}</blockquote>`;continue}
   if(l.includes('|')&&i+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
    const h=cells(l);i+=2;let r='';
    while(i<L.length&&L[i].includes('|')&&L[i].trim()){r+='<tr>'+cells(L[i]).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>';i++}
    o+=`<div class="tw"><table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${r}</tbody></table></div>`;continue}
   if(LI.test(l)){
    const items=[];
    while(i<L.length&&L[i].trim()&&(m=L[i].match(LI))){items.push({ind:m[1].replace(/\t/g,'  ').length,mk:m[2],txt:m[3]});i++}
    o+=buildList(items,[0],items[0].ind);continue}
   const b=[];
   while(i<L.length&&L[i].trim()&&!(b.length&&starts(L[i])))b.push(L[i++]);
   o+=`<p>${b.map(inline).join('<br>')}</p>`;
  }
  return o;
 }
 return{render};
})();

/* ---------- providers + API ---------- */
class ApiError extends Error{constructor(status,msg){super(msg);this.status=status}}
const PROV={
 gemini:{name:'Google Gemini',kind:'gemini',url:'https://generativelanguage.googleapis.com/v1beta',models:['gemini-2.5-flash','gemini-2.5-pro','gemini-2.5-flash-lite'],get:'https://aistudio.google.com/apikey',ph:'AIza…'},
 openai:{name:'OpenAI',kind:'openai',url:'https://api.openai.com/v1',models:['gpt-4o','gpt-4o-mini','gpt-4.1'],get:'https://platform.openai.com/api-keys',ph:'sk-…'},
 anthropic:{name:'Anthropic Claude',kind:'anthropic',url:'https://api.anthropic.com',models:['claude-sonnet-4-6','claude-haiku-4-5'],get:'https://console.anthropic.com/settings/keys',ph:'sk-ant-…'},

 if(e.status===400)return'Bad request: '+m;
 if(e.status===401||e.status===403)return'Access denied. Your key may be invalid, restricted, or not enabled for this model.';
 if(e.status===402)return'Billing or credits problem: '+m;
 if(e.status===404)return'Model or endpoint not found. Check the model name and base URL in Settings.';
 if(e.status===429)return'Rate limit or quota reached. Wait a moment, or switch to a lighter model.';

 },
 msg(m,i,s){
  if(m.role==='user')return`<div class="msg flex justify-end"><div class="max-w-[88%] whitespace-pre-wrap break-words rounded-[20px] rounded-br-md bg-blue px-4 py-2.5 text-[15.5px] leading-relaxed text-white shadow-[0_3px_0_#1B3FBF] sm:max-w-[78%]">${esc(m.text)}</div></div>`;
  const live=S.busy&&i===s.messages.length-1,last=i===s.messages.length-1;
  let body='';
  if(live)body=m.text?`<div class="md caret" data-live>${MD.render(m.text)}</div>`:`<div data-live class="flex h-7 items-center gap-1.5" aria-label="The model is thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  else if(m.text)body=`<div class="md">${MD.render(m.text)}</div>`;
  const err=m.error?`<div class="mt-2 flex items-start gap-3 rounded-2xl border-2 border-coral/50 bg-[#FFF1EF] px-4 py-3 text-sm"><div class="flex-1"><div class="font-semibold text-coral">Couldn’t finish this reply</div><div class="mt-0.5 text-ink/80">${esc(m.error)}</div></div><div class="flex shrink-0 gap-2"><button data-act="key" class="rounded-lg border-2 border-ink/15 bg-white px-3 py-1.5 font-semibold hover:bg-board">Settings</button><button data-act="retry" data-i="${i}" class="rounded-lg bg-coral px-3 py-1.5 font-semibold text-white hover:brightness-95">Retry</button></div></div>`:'';
  const note=m.stopped?'<p class="mt-2 text-xs font-medium text-ink/50">Stopped. The partial reply is kept.</p>':m.truncated?'<p class="mt-2 text-xs font-medium text-ink/50">Reply hit the length limit. Ask me to continue.</p>':'';
  const tools=!live&&m.text?`<div class="mt-2 flex flex-wrap items-center gap-1.5 text-xs text-ink/60"><button data-act="msg" data-i="${i}" class="flex items-center gap-1.5 rounded-lg px-2 py-1 hover:bg-white hover:text-ink">${I.copy}<span>Copy</span></button>${last&&!S.busy?`<button data-act="regen" data-i="${i}" class="flex items-center gap-1.5 rounded-lg px-2 py-1 hover:bg-white hover:text-ink">${I.redo}<span>Regenerate</span></button>`:''}${m.tokens?`<span class="ml-1 flex items-center gap-2 rounded-full border-2 border-ink/10 bg-white px-2.5 py-0.5 font-mono text-[11px]" title="Input tokens (whole conversation sent) and output tokens"><span class="text-blue">↑ ${m.tokens.in.toLocaleString()}</span><span class="text-mint">↓ ${m.tokens.out.toLocaleString()}</span></span>`:''}</div>`:'';
  return`<div class="msg flex gap-3"><div class="mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-xl bg-ink" aria-hidden="true">${I.spark}</div><div class="min-w-0 flex-1">${body}${err}${note}${tools}</div></div>`;
 }
};
UI.init();
</script>
</body>
</html>
